<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iRam IT Admin — Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <style>
    :root {
      --green: #6BBF4E; --green-dark: #4e9938; --dark: #2D2D2D;
      --border: #dde; --danger: #d83b01;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: #fff;
      border-radius: 12px;
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px; justify-content: center;
    }
    .logo svg { width: 40px; height: 40px; }
    .logo-text .brand { font-size: 22px; font-weight: 800; color: var(--dark); letter-spacing: 1px; }
    .logo-text .sub   { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    h2 { font-size: 18px; font-weight: 600; color: var(--dark); margin-bottom: 6px; text-align: center; }
    .sub-heading { font-size: 13px; color: #888; text-align: center; margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #555;
            text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 6px; font-size: 15px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(107,191,78,0.15); }
    .field { margin-bottom: 18px; }
    .error-banner {
      display: none; background: #fff3ef; border: 1.5px solid var(--danger);
      color: var(--danger); border-radius: 6px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px; font-weight: 600;
    }
    .btn-login {
      width: 100%; background: var(--green); color: #fff; border: none;
      border-radius: 7px; padding: 14px; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 4px; transition: background 0.2s;
    }
    .btn-login:hover { background: var(--green-dark); }
    .back-link { display: block; text-align: center; margin-top: 20px;
                 font-size: 13px; color: #888; text-decoration: none; }
    .back-link:hover { color: var(--green-dark); }
    .show-pw { font-size: 12px; color: var(--green-dark); cursor: pointer;
               float: right; font-weight: 600; text-decoration: underline; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="2"  width="10" height="10" rx="2" fill="#6BBF4E"/>
        <rect x="14" y="26" width="10" height="10" rx="2" fill="#6BBF4E"/>
        <rect x="2"  y="14" width="10" height="10" rx="2" fill="#6BBF4E"/>
        <rect x="26" y="14" width="10" height="10" rx="2" fill="#6BBF4E"/>
        <rect x="14" y="14" width="10" height="10" rx="2" fill="#4e9938"/>
      </svg>
      <div class="logo-text">
        <div class="brand">iRam</div>
        <div class="sub">IT Admin Portal</div>
      </div>
    </div>

    <h2 id="step-title">Staff Login</h2>
    <p class="sub-heading" id="step-sub">Enter your username or email and password to access the admin portal</p>

    <div class="error-banner" id="error-banner">Incorrect username or password. Please try again.</div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username or email</label>
        <input type="text" id="username" placeholder="Enter your username or email" autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">
          Password
          <span class="show-pw" id="show-pw-btn">Show</span>
        </label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Login to Admin Panel →</button>
    </form>
    <a href="#" class="back-link" id="forgot-link" style="margin-top:14px">Forgot your username or password?</a>

    <form id="forgot-form" novalidate style="display:none">
      <div class="field" id="forgot-field">
        <label for="forgot-identifier">Username or email</label>
        <input type="text" id="forgot-identifier" placeholder="Enter your username or email" autocomplete="username">
      </div>
      <button type="submit" class="btn-login" id="forgot-submit-btn">Send reset instructions →</button>
    </form>
    <a href="#" class="back-link" id="forgot-cancel" style="display:none">← Back to login</a>

    <form id="mfa-form" novalidate style="display:none">
      <div class="field">
        <label for="mfa-code">6-digit code</label>
        <input type="text" id="mfa-code" placeholder="123456" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      </div>
      <button type="submit" class="btn-login">Verify →</button>
    </form>

    <form id="reset-form" novalidate style="display:none">
      <div class="field">
        <label for="reset-password">New password</label>
        <input type="password" id="reset-password" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="reset-password-confirm">Confirm new password</label>
        <input type="password" id="reset-password-confirm" placeholder="Re-enter the new password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-login">Set password & log in →</button>
    </form>

    <a href="index.html" class="back-link">← Back to Ticket Submission Form</a>
  </div>

  <script src="assets/config.js"></script>
  <script>
    // Toggle password visibility
    document.getElementById('show-pw-btn').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const btn = document.getElementById('show-pw-btn');
      if (pw.type === 'password') { pw.type = 'text'; btn.textContent = 'Hide'; }
      else { pw.type = 'password'; btn.textContent = 'Show'; }
    });

    // Role → permissions, mirrors lib/roles.js. Duplicated here (no build step
    // on this static site) purely to decide which admin page to land on.
    const ROLE_PERMS = {
      super_admin: ['manageUsers', 'editHR', 'editIT', 'manageTickets'],
      admin:       ['editHR', 'editIT', 'manageTickets'],
      hr_admin:    ['editHR'],
      it:          ['manageTickets'],
      hr_manager: [], hr: [], assistant_hr: [], field_goosehelp: [], staff: []
    };
    function landingPage(role) {
      const perms = ROLE_PERMS[role] || [];
      if (perms.includes('manageTickets') || perms.includes('editIT')) return 'admin/index.html';
      if (perms.includes('editHR')) return 'admin/site-edit.html';
      return null; // identity-only role: nowhere to land yet
    }

    const forms = {
      login:  document.getElementById('login-form'),
      forgot: document.getElementById('forgot-form'),
      mfa:    document.getElementById('mfa-form'),
      reset:  document.getElementById('reset-form')
    };
    function showStep(step, title, sub) {
      Object.values(forms).forEach(f => f.style.display = 'none');
      document.getElementById('forgot-link').style.display = step === 'login' ? 'block' : 'none';
      document.getElementById('forgot-cancel').style.display = step === 'forgot' ? 'block' : 'none';
      forms[step].style.display = 'block';
      document.getElementById('step-title').textContent = title;
      document.getElementById('step-sub').textContent = sub;
      document.getElementById('error-banner').style.display = 'none';
    }

    let pendingToken = null;
    let resetEndpoint = '/api/admin/force-change-password'; // switched below if arriving via an emailed reset link

    // Arriving from the "forgot password" email? ?reset=<token> jumps straight
    // to the set-new-password step, skipping the "already logged in" check
    // below (a reset link should always be honored, even from an existing session).
    const urlResetToken = new URLSearchParams(location.search).get('reset');
    if (urlResetToken) {
      pendingToken = urlResetToken;
      resetEndpoint = '/api/admin/reset-password';
      showStep('reset', 'Reset Your Password', 'Choose a new password to finish resetting your account.');
    } else {
      // Already logged in? The session lives in an httpOnly cookie the JS here
      // can't read directly, so ask the server rather than trusting sessionStorage.
      (async () => {
        try {
          const res = await fetch('/api/admin/me', { cache: 'no-store' });
          if (res.ok) {
            const me = await res.json();
            const dest = landingPage(me.role);
            if (dest) window.location.href = dest;
          }
        } catch (_) {}
      })();
    }

    function loginOk({ username, role }) {
      sessionStorage.setItem('iram_it_auth', 'true');
      sessionStorage.setItem('iram_username', username);
      sessionStorage.setItem('iram_role', role);

      const dest = landingPage(role);
      if (dest) { window.location.href = dest; return; }
      showError("You're logged in, but your account (" + role + ") doesn't have access to an admin page yet. Ask a Super Admin to grant you a permission.");
    }
    function showError(message) {
      document.getElementById('error-banner').textContent = message || 'Incorrect username or password. Please try again.';
      document.getElementById('error-banner').style.display = 'block';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showError('Enter both a username/email and a password.'); return; }

      try {
        const res  = await fetch('/api/admin/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) { showError(data.error); document.getElementById('password').value = ''; return; }

        if (data.mustChangePassword) {
          pendingToken = data.pendingToken;
          showStep('reset', 'Choose a New Password', 'Your password needs to be changed before you can continue.');
          return;
        }
        if (data.mfaRequired) {
          pendingToken = data.pendingToken;
          showStep('mfa', 'Enter Your Code', data.mfaRequired === 'email'
            ? 'We emailed a 6-digit code to your account\'s email address.'
            : 'Enter the 6-digit code from your authenticator app.');
          return;
        }
        loginOk(data);
      } catch (_) {
        showError('Could not reach the server. Please try again.');
      }
    });

    document.getElementById('mfa-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('mfa-code').value.trim();
      if (!code) return;
      try {
        const res  = await fetch('/api/admin/mfa-verify', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ pendingToken, code })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) { showError(data.error); document.getElementById('mfa-code').value = ''; return; }
        loginOk(data);
      } catch (_) {
        showError('Could not reach the server. Please try again.');
      }
    });

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('reset-password').value;
      const p2 = document.getElementById('reset-password-confirm').value;
      if (p1.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (p1 !== p2) { showError('Passwords do not match.'); return; }
      try {
        const body = resetEndpoint.endsWith('reset-password')
          ? { resetToken: pendingToken, newPassword: p1 }
          : { pendingToken, newPassword: p1 };
        const res  = await fetch(resetEndpoint, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) { showError(data.error); return; }
        loginOk(data);
      } catch (_) {
        showError('Could not reach the server. Please try again.');
      }
    });

    document.getElementById('forgot-link').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('forgot-field').style.display = 'block';
      document.getElementById('forgot-submit-btn').style.display = 'block';
      document.getElementById('forgot-identifier').value = '';
      showStep('forgot', 'Reset Your Password', "Enter your username or email — if it matches an account, we'll send reset instructions.");
    });
    document.getElementById('forgot-cancel').addEventListener('click', (e) => {
      e.preventDefault();
      showStep('login', 'Staff Login', 'Enter your username or email and password to access the admin portal');
    });
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('forgot-identifier').value.trim();
      if (!identifier) return;
      try {
        const res  = await fetch('/api/admin/forgot-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ identifier })
        });
        const data = await res.json().catch(() => ({}));
        // Deliberately shown whether or not an account matched — the endpoint
        // never reveals that, so neither does this.
        document.getElementById('forgot-field').style.display = 'none';
        document.getElementById('forgot-submit-btn').style.display = 'none';
        document.getElementById('step-sub').textContent = data.message || "If that account exists, we've emailed instructions to reset the password.";
      } catch (_) {
        showError('Could not reach the server. Please try again.');
      }
    });
  </script>
</body>
</html>
